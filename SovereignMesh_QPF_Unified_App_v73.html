<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>SovereignMesh QPF v73 – Operations Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root { --bg:#0a0e17; --card:#111827; --border:#1f2937; --cyan:#22d3ee; --purple:#a78bfa; --emerald:#34d399; --amber:#fbbf24; --rose:#fb7185; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:#e5e7eb;min-height:100vh}
header{border-bottom:1px solid var(--border);background:#0f172a;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:10}
h1{font-size:18px;background:linear-gradient(90deg,#22d3ee,#a78bfa,#34d399);-webkit-background-clip:text;color:transparent;font-weight:700}
.sub{font-size:12px;color:#9ca3af}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#1f2937;color:#e5e7eb}
.btn.emerald{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.4);color:var(--emerald)}
.btn.amber{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.4);color:var(--amber)}
.btn.rose{background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.4);color:var(--rose)}
main{max-width:1280px;margin:0 auto;padding:20px;display:grid;gap:16px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
.metric{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.metric.cyan{color:var(--cyan)} .metric.purple{color:var(--purple)} .metric.emerald{color:var(--emerald)} .metric.amber{color:var(--amber)} .metric.rose{color:var(--rose)}
.label{font-size:11px;color:#9ca3af;margin-bottom:4px}
.canvas-wrap{background:#020617;border-radius:12px;border:1px solid var(--border);height:220px;position:relative;overflow:hidden}
canvas{width:100%;height:100%}
.log{font-family:ui-monospace,monospace;font-size:11px;background:#020617;border-radius:10px;padding:12px;height:200px;overflow-y:auto;border:1px solid var(--border)}
.mode-bar{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function App() {
  const [latency, setLatency] = React.useState(1e-16);
  const [threats, setThreats] = React.useState(0);
  const [mode, setMode] = React.useState('NORMAL');
  const [beacon, setBeacon] = React.useState('ENTANGLED');
  const [entropy, setEntropy] = React.useState(0.35);
  const [qsilEpistemic, setQsilEpistemic] = React.useState('C(φ) + K_i(K_j)');
  const [qsilDeontic, setQsilDeontic] = React.useState('99.99%');
  const [z3, setZ3] = React.useState('19/19 PROVEN');
  const [payment, setPayment] = React.useState('PROTECTED');
  const [forecast, setForecast] = React.useState('STABLE');
  const [logs, setLogs] = React.useState([]);
  const [running, setRunning] = React.useState(true);
  const canvasRef = React.useRef(null);

  React.useEffect(() => {
    if (!running) return;
    const id = setInterval(() => {
      const base = mode === 'STRESS' ? 1.5e-16 : mode === 'AIR-GAP' ? 0.7e-16 : 1e-16;
      setLatency(base + Math.random() * 2e-18);
      setEntropy(0.30 + Math.random() * (mode === 'STRESS' ? 0.14 : 0.05));
      if (Math.random() > 0.8) {
        const types = ['CLEAN', 'IOC_MATCH', 'ENTROPY_SPIKE', 'PAYMENT_TX', 'FORECAST', 'Z3_UPDATE', 'COMMON_KNOWLEDGE'];
        const t = types[Math.floor(Math.random()*types.length)];
        const drop = t.includes('IOC') || t.includes('SPIKE');
        setLogs(l => [{ts: new Date().toISOString().slice(11,23), type: t, verdict: drop ? 'DROP' : 'ALLOW'}, ...l.slice(0,19)]);
        if (drop) setThreats(x => x+1);
      }
    }, mode === 'STRESS' ? 400 : 800);
    return () => clearInterval(id);
  }, [running, mode]);

  React.useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let raf;
    const nodes = [
      {x:0.15,y:0.5,label:'Client'},
      {x:0.4,y:0.3,label:'Gateway A'},
      {x:0.6,y:0.7,label:'Gateway B'},
      {x:0.85,y:0.5,label:'Ledger'}
    ];
    const packets = [];
    const loop = () => {
      const w = canvas.width = canvas.parentElement.clientWidth;
      const h = canvas.height = 220;
      ctx.clearRect(0,0,w,h);
      ctx.strokeStyle = 'rgba(167,139,250,0.4)';
      ctx.lineWidth = 1.5;
      [[0,1],[0,2],[1,3],[2,3],[1,2]].forEach(([i,j]) => {
        ctx.beginPath();
        ctx.moveTo(nodes[i].x*w, nodes[i].y*h);
        ctx.lineTo(nodes[j].x*w, nodes[j].y*h);
        ctx.stroke();
      });
      if (running && Math.random()<0.12) packets.push({route: Math.random()>0.5?[0,1,3]:[0,2,3], step:0, p:0});
      packets.forEach((p,idx) => {
        p.p += 0.04;
        if (p.p >= 1) { p.p = 0; p.step++; }
        if (p.step >= p.route.length-1) { packets.splice(idx,1); return; }
        const a = nodes[p.route[p.step]], b = nodes[p.route[p.step+1]];
        const x = (a.x + (b.x-a.x)*p.p)*w, y = (a.y + (b.y-a.y)*p.p)*h;
        ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2);
        ctx.fillStyle = '#a78bfa'; ctx.fill();
      });
      nodes.forEach(n => {
        const x=n.x*w, y=n.y*h;
        ctx.beginPath(); ctx.arc(x,y,14,0,Math.PI*2);
        ctx.fillStyle='#0f172a'; ctx.strokeStyle='#8b5cf6'; ctx.lineWidth=2;
        ctx.fill(); ctx.stroke();
        ctx.fillStyle='#f8fafc'; ctx.font='11px sans-serif'; ctx.textAlign='center';
        ctx.fillText(n.label, x, y+28);
      });
      raf = requestAnimationFrame(loop);
    };
    loop();
    return () => cancelAnimationFrame(raf);
  }, [running]);

  return (
    <>
      <header>
        <div>
          <h1>SovereignMesh QPF v73</h1>
          <div className="sub">Common Knowledge C(φ) · Predictive Temporal QSIL · Operations Console</div>
        </div>
        <div className="controls">
          <div className="mode-bar">
            {['NORMAL','STRESS','AIR-GAP'].map(m => (
              <button key={m} className={`btn ${mode===m?'emerald':''}`} onClick={()=>setMode(m)}>{m}</button>
            ))}
          </div>
          <button className={`btn ${running?'amber':'emerald'}`} onClick={()=>setRunning(!running)}>
            {running ? 'Pause' : 'Resume'}
          </button>
        </div>
      </header>
      <main>
        <div className="grid4">
          <div className="card"><div className="label">Latency Model</div><div className="metric cyan">{latency.toExponential(1)} ns</div></div>
          <div className="card"><div className="label">Threats Dropped</div><div className="metric rose">{threats}</div></div>
          <div className="card"><div className="label">Entropy (multi-dim)</div><div className="metric emerald">{entropy.toFixed(3)}</div></div>
          <div className="card"><div className="label">Z3 Verification</div><div className="metric purple">{z3}</div></div>
        </div>
        <div className="grid4">
          <div className="card"><div className="label">QSIL Epistemic</div><div className="metric cyan">{qsilEpistemic}</div></div>
          <div className="card"><div className="label">QSIL Deontic</div><div className="metric emerald">{qsilDeontic}</div></div>
          <div className="card"><div className="label">Payment Stack</div><div className="metric purple">{payment}</div></div>
          <div className="card"><div className="label">Beacon / Forecast</div><div className="metric amber">{beacon} · {forecast}</div></div>
        </div>
        <div className="card">
          <div className="label">Mesh Topology (Common Knowledge pulses)</div>
          <div className="canvas-wrap"><canvas ref={canvasRef} /></div>
        </div>
        <div className="card">
          <div className="label">Activity Log</div>
          <div className="log">
            {logs.map((l,i) => (
              <div key={i} style={{marginBottom:4,color: l.verdict==='DROP'?'#fb7185':'#34d399'}}>
                [{l.ts}] {l.type} → {l.verdict}
              </div>
            ))}
            {logs.length===0 && <div style={{color:'#9ca3af'}}>Listening for telemetry…</div>}
          </div>
        </div>
      </main>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
