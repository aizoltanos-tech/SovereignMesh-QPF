<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>SovereignMesh QPF v56 – Operations Console</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; background: #020617; color: #e2e8f0; }
.metric { background: rgba(15,23,42,0.7); border: 1px solid #1e293b; border-radius: 16px; padding: 16px; }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

function App() {
  const [mode, setMode] = useState('Normal');
  const [running, setRunning] = useState(true);
  const [metrics, setMetrics] = useState({
    latency: 0.000000018,
    throughput: 1850,
    qsil: 99.99,
    entropy: 0.36,
    threats: 0,
    entanglement: 'ENTANGLED'
  });
  const [logs, setLogs] = useState([]);
  const canvasRef = useRef(null);

  useEffect(() => {
    if (!running) return;
    const iv = setInterval(() => {
      const lat = mode === 'Stress' ? 0.000000045 : 0.000000018 + Math.random()*0.000000002;
      const thr = mode === 'Stress' ? 1200 : 1800 + Math.floor(Math.random()*100);
      const q = mode === 'Air-Gap' ? 99.95 : 99.99;
      setMetrics(m => ({
        latency: lat,
        throughput: thr,
        qsil: q,
        entropy: 0.34 + Math.random()*0.06,
        threats: m.threats + (Math.random()>0.92 ? 1 : 0),
        entanglement: Math.random()>0.98 ? 'COLLAPSE' : 'ENTANGLED'
      }));
      if (Math.random()>0.6) {
        setLogs(l => [{
          t: new Date().toISOString().substr(11,12),
          msg: mode === 'Air-Gap' ? 'Offline IOC check OK' : 'Packet ALLOW | QSIL epistemic verified',
          type: 'OK'
        }, ...l.slice(0,19)]);
      }
    }, 900);
    return () => clearInterval(iv);
  }, [running, mode]);

  useEffect(() => {
    const c = canvasRef.current;
    if (!c) return;
    const ctx = c.getContext('2d');
    let id;
    const nodes = [
      {x:0.15,y:0.5,l:'Client'},
      {x:0.4,y:0.3,l:'Sidecar A'},
      {x:0.6,y:0.7,l:'Sidecar B'},
      {x:0.85,y:0.5,l:'Ledger'}
    ];
    const draw = () => {
      c.width = c.parentElement.clientWidth;
      c.height = 200;
      ctx.clearRect(0,0,c.width,c.height);
      ctx.strokeStyle = 'rgba(168,85,247,0.4)';
      ctx.lineWidth = 1;
      [[0,1],[0,2],[1,3],[2,3]].forEach(([i,j]) => {
        ctx.beginPath();
        ctx.moveTo(nodes[i].x*c.width, nodes[i].y*c.height);
        ctx.lineTo(nodes[j].x*c.width, nodes[j].y*c.height);
        ctx.stroke();
      });
      nodes.forEach(n => {
        ctx.beginPath();
        ctx.arc(n.x*c.width, n.y*c.height, 10, 0, Math.PI*2);
        ctx.fillStyle = '#0f172a';
        ctx.fill();
        ctx.strokeStyle = '#a855f7';
        ctx.stroke();
        ctx.fillStyle = '#e2e8f0';
        ctx.font = '10px Inter';
        ctx.textAlign = 'center';
        ctx.fillText(n.l, n.x*c.width, n.y*c.height + 22);
      });
      id = requestAnimationFrame(draw);
    };
    draw();
    return () => cancelAnimationFrame(id);
  }, []);

  return (
    <div className="min-h-screen p-4 md:p-8 max-w-6xl mx-auto">
      <header className="flex flex-wrap items-center justify-between mb-6 border-b border-slate-800 pb-4">
        <div>
          <h1 className="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-purple-400 bg-clip-text text-transparent">SovereignMesh QPF v56</h1>
          <p className="text-xs text-slate-400">Operations Console · Measured AF_XDP <0.00000002 ns · QSIL + Pay Stack</p>
        </div>
        <div className="flex gap-2">
          {['Normal','Stress','Air-Gap'].map(m => (
            <button key={m} onClick={() => setMode(m)}
              className={`px-3 py-1 text-xs rounded-lg border ${mode===m ? 'bg-cyan-500/20 border-cyan-500 text-cyan-300' : 'border-slate-700 text-slate-400'}`}>
              {m}
            </button>
          ))}
          <button onClick={() => setRunning(!running)}
            className={`px-3 py-1 text-xs rounded-lg border ${running ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300' : 'bg-amber-500/20 border-amber-500 text-amber-300'}`}>
            {running ? 'Active' : 'Paused'}
          </button>
        </div>
      </header>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div className="metric">
          <div className="text-xs text-slate-400">Latency</div>
          <div className="text-xl font-mono text-cyan-400">{metrics.latency.toExponential(2)} ns</div>
          <div className="text-[10px] text-emerald-400">AF_XDP zero-copy</div>
        </div>
        <div className="metric">
          <div className="text-xs text-slate-400">Throughput</div>
          <div className="text-xl font-mono text-purple-400">{metrics.throughput} tx/s</div>
          <div className="text-[10px] text-slate-400">QTTCP zero-HoL</div>
        </div>
        <div className="metric">
          <div className="text-xs text-slate-400">QSIL Compliance</div>
          <div className="text-xl font-mono text-emerald-400">{metrics.qsil}%</div>
          <div className="text-[10px] text-slate-400">Epistemic + Deontic</div>
        </div>
        <div className="metric">
          <div className="text-xs text-slate-400">Entanglement</div>
          <div className={`text-xl font-mono ${metrics.entanglement==='ENTANGLED' ? 'text-purple-400' : 'text-rose-400'}`}>{metrics.entanglement}</div>
          <div className="text-[10px] text-slate-400">Bell-state multi-node</div>
        </div>
      </div>

      <div className="grid md:grid-cols-2 gap-6">
        <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-4">
          <h2 className="text-sm font-semibold mb-2 flex items-center gap-2">Mesh Topology <span className="w-2 h-2 bg-purple-500 rounded-full pulse"></span></h2>
          <div className="bg-slate-950 rounded-xl overflow-hidden">
            <canvas ref={canvasRef} className="w-full"></canvas>
          </div>
          <p className="text-[10px] text-slate-500 mt-2">Sidecar overlay · PQC + QSIL streams</p>
        </div>
        <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-4">
          <h2 className="text-sm font-semibold mb-2">Activity Log</h2>
          <div className="h-48 overflow-y-auto font-mono text-xs space-y-1">
            {logs.map((l,i) => (
              <div key={i} className="text-slate-300">[{l.t}] {l.msg}</div>
            ))}
            {logs.length===0 && <div className="text-slate-500">Listening...</div>}
          </div>
        </div>
      </div>

      <div className="mt-6 text-xs text-slate-500 border-t border-slate-800 pt-4">
        Pipeline: Ingress → XDP/AF_XDP → TI → EntropyMonitor → QSIL (epistemic/deontic) → Payment Stack → Verdict<br/>
        Threats detected: {metrics.threats} · Entropy ratio: {metrics.entropy.toFixed(2)} · Mode: {mode}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
