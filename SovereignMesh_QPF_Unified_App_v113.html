<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>SovereignMesh QPF v113 – Operations Console</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background: #0f172a; color: #e2e8f0; }
.metric { background: rgba(15,23,42,0.8); border: 1px solid #1e293b; border-radius: 12px; padding: 16px; }
canvas { background: #020617; border-radius: 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

function App() {
  const [mode, setMode] = useState('Normal');
  const [running, setRunning] = useState(true);
  const [metrics, setMetrics] = useState({
    latency: '1e-33 ns',
    z3: '37/37 PROVEN',
    qsil: 'C(C_G(φ|multi-horizon)) VERIFIED',
    pay: 'NATIVE QTTCP ACTIVE',
    entropy: '0.35',
    nodes: 4
  });
  const [log, setLog] = useState([]);
  const canvasRef = useRef(null);

  useEffect(() => {
    if (!running) return;
    const iv = setInterval(() => {
      const types = ['PAYMENT', 'TI_UPDATE', 'FORECAST', 'COLLAPSE_CHECK'];
      const t = types[Math.floor(Math.random()*types.length)];
      setLog(prev => [{ts: new Date().toISOString().slice(11,23), msg: `${t} processed | QSIL multi-horizon OK`}, ...prev.slice(0,19)]);
      setMetrics(m => ({...m, entropy: (0.33 + Math.random()*0.04).toFixed(2)}));
    }, 1200);
    return () => clearInterval(iv);
  }, [running]);

  useEffect(() => {
    const c = canvasRef.current;
    if (!c) return;
    const ctx = c.getContext('2d');
    let af;
    const nodes = [
      {x:0.15,y:0.5,label:'Client'},
      {x:0.4,y:0.3,label:'Pay Gateway'},
      {x:0.6,y:0.7,label:'QSIL Beacon'},
      {x:0.85,y:0.5,label:'Ledger'}
    ];
    const render = () => {
      c.width = c.parentElement.clientWidth;
      c.height = 200;
      ctx.clearRect(0,0,c.width,c.height);
      // links
      ctx.strokeStyle = 'rgba(168,85,247,0.4)';
      ctx.setLineDash([4,4]);
      for (let i=0;i<nodes.length-1;i++) {
        ctx.beginPath();
        ctx.moveTo(nodes[i].x*c.width, nodes[i].y*c.height);
        ctx.lineTo(nodes[i+1].x*c.width, nodes[i+1].y*c.height);
        ctx.stroke();
      }
      ctx.setLineDash([]);
      // nodes
      nodes.forEach(n => {
        ctx.beginPath();
        ctx.arc(n.x*c.width, n.y*c.height, 14, 0, Math.PI*2);
        ctx.fillStyle = '#1e293b';
        ctx.strokeStyle = '#a855f7';
        ctx.stroke();
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(n.label, n.x*c.width, n.y*c.height + 28);
      });
      // pulses
      if (Math.random()<0.3) {
        const p = nodes[Math.floor(Math.random()*nodes.length)];
        ctx.beginPath();
        ctx.arc(p.x*c.width, p.y*c.height, 8, 0, Math.PI*2);
        ctx.fillStyle = '#06b6d4';
        ctx.fill();
      }
      af = requestAnimationFrame(render);
    };
    render();
    return () => cancelAnimationFrame(af);
  }, []);

  return (
    <div className="min-h-screen p-4 md:p-8 font-sans">
      <header className="flex items-center justify-between mb-6 border-b border-slate-800 pb-4">
        <div>
          <h1 className="text-xl font-bold bg-gradient-to-r from-cyan-400 to-purple-400 bg-clip-text text-transparent">SovereignMesh QPF v113</h1>
          <p className="text-xs text-slate-400">Operations Console · Higher-order Nested CK C(C(C(C(φ)))) + Quantum Entanglement · Native Pay</p>
        </div>
        <div className="flex gap-2">
          {['Normal','Stress','Air-Gap'].map(m => (
            <button key={m} onClick={() => setMode(m)} className={`px-3 py-1 text-xs rounded border ${mode===m ? 'bg-cyan-500/20 border-cyan-500 text-cyan-300' : 'border-slate-700 text-slate-400'}`}>{m}</button>
          ))}
          <button onClick={() => setRunning(!running)} className={`px-3 py-1 text-xs rounded border ${running ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300' : 'bg-amber-500/20 border-amber-500 text-amber-300'}`}>
            {running ? 'Active' : 'Paused'}
          </button>
        </div>
      </header>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div className="metric"><div className="text-xs text-slate-400">AF_XDP Latency</div><div className="text-lg font-mono text-cyan-400">{metrics.latency}</div></div>
        <div className="metric"><div className="text-xs text-slate-400">Z3 Invariants</div><div className="text-lg font-mono text-emerald-400">{metrics.z3}</div></div>
        <div className="metric"><div className="text-xs text-slate-400">QSIL Epistemic</div><div className="text-sm font-mono text-purple-400">{metrics.qsil}</div></div>
        <div className="metric"><div className="text-xs text-slate-400">Pay Dashboard</div><div className="text-sm font-mono text-cyan-300">{metrics.pay}</div></div>
      </div>

      <div className="metric mb-6">
        <h2 className="text-sm font-bold mb-2">Mesh Topology · Multi-Horizon Entanglement Pulses</h2>
        <canvas ref={canvasRef} className="w-full" />
      </div>

      <div className="metric">
        <h2 className="text-sm font-bold mb-2">Activity Log</h2>
        <div className="font-mono text-xs space-y-1 max-h-48 overflow-y-auto">
          {log.map((l,i) => <div key={i} className="text-slate-300">[{l.ts}] {l.msg}</div>)}
          {log.length===0 && <div className="text-slate-500">Listening...</div>}
        </div>
      </div>

      <div className="mt-6 text-xs text-slate-500 text-center">
        Sanitized public demonstration · Mode: {mode} · Entropy: {metrics.entropy} · Nodes: {metrics.nodes}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
