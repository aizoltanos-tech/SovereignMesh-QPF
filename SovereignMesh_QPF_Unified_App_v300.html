<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SovereignMesh QPF v300 – Operations Console</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --border:#334155; --cyan:#22d3ee; --purple:#a855f7; --emerald:#34d399; --amber:#fbbf24; --rose:#f43f5e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:#f1f5f9; font-family:system-ui,-apple-system,sans-serif; min-height:100vh; }
  header { border-bottom:1px solid var(--border); background:rgba(15,23,42,0.85); backdrop-filter:blur(12px); padding:12px 24px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; position:sticky; top:0; z-index:50; }
  .logo { display:flex; align-items:center; gap:12px; }
  .logo-icon { width:40px; height:40px; background:linear-gradient(135deg,#0891b2,#7c3aed); border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:700; color:white; }
  h1 { font-size:1.15rem; background:linear-gradient(90deg,#22d3ee,#c084fc,#34d399); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .sub { font-size:0.7rem; color:#94a3b8; }
  .tabs { display:flex; gap:4px; background:#0f172a; padding:4px; border-radius:12px; border:1px solid var(--border); }
  .tab { padding:6px 12px; border-radius:8px; font-size:0.75rem; font-weight:600; cursor:pointer; color:#94a3b8; border:none; background:transparent; }
  .tab.active { background:linear-gradient(90deg,rgba(34,211,238,0.15),rgba(168,85,247,0.15)); color:#67e8f9; border:1px solid rgba(34,211,238,0.3); }
  .btn { padding:6px 14px; border-radius:8px; font-size:0.75rem; font-weight:600; cursor:pointer; border:1px solid; }
  .btn-run { background:rgba(16,185,129,0.12); border-color:rgba(16,185,129,0.35); color:#34d399; }
  .btn-pause { background:rgba(251,191,36,0.12); border-color:rgba(251,191,36,0.35); color:#fbbf24; }
  main { max-width:1200px; margin:0 auto; padding:20px; display:flex; flex-direction:column; gap:20px; }
  .control-bar { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px 20px; }
  .grid-4 { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  .metric-card { background:rgba(30,41,59,0.7); border:1px solid var(--border); border-radius:14px; padding:14px; }
  .metric-label { font-size:0.7rem; color:#94a3b8; margin-bottom:4px; }
  .metric-value { font-size:1.6rem; font-weight:700; font-family:ui-monospace,monospace; }
  .metric-sub { font-size:0.65rem; color:#64748b; margin-top:6px; }
  .panel { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px; }
  .panel h2 { font-size:0.85rem; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .mode-btns { display:flex; gap:8px; flex-wrap:wrap; }
  .mode-btn { padding:8px 14px; border-radius:10px; font-size:0.75rem; font-weight:600; cursor:pointer; border:1px solid var(--border); background:#0f172a; color:#94a3b8; }
  .mode-btn.active { border-color:#22d3ee; color:#67e8f9; background:rgba(34,211,238,0.1); }
  .log-box { background:#020617; border:1px solid var(--border); border-radius:12px; padding:12px; height:280px; overflow-y:auto; font-family:ui-monospace,monospace; font-size:0.7rem; }
  .log-line { padding:6px 8px; border-bottom:1px solid #1e293b; display:flex; justify-content:space-between; gap:8px; }
  .status-ok { color:#34d399; }
  .status-drop { color:#f43f5e; }
  .status-info { color:#22d3ee; }
  .mesh-canvas { width:100%; height:200px; background:#020617; border-radius:12px; border:1px solid var(--border); }
  .footer { text-align:center; font-size:0.65rem; color:#64748b; padding:12px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

function App() {
  const [running, setRunning] = useState(true);
  const [mode, setMode] = useState('NORMAL');
  const [logs, setLogs] = useState([]);
  const [metrics, setMetrics] = useState({
    ck: 'C²¹⁰',
    z3: '247/247',
    latency: '<1e-241 ns',
    nodes: 8,
    entropy: 'OK'
  });

  useEffect(() => {
    if (!running) return;
    const id = setInterval(() => {
      const types = ['INSTANT_PAYMENT', 'CLEARING_SETTLEMENT', 'KYC_VERIFY', 'PAYMENT'];
      const t = types[Math.floor(Math.random()*types.length)];
      const risk = Math.floor(Math.random()*100);
      const verdict = (t === 'KYC_VERIFY' || risk > 80) ? 'DROP' : 'ALLOW';
      const line = {
        time: new Date().toLocaleTimeString(),
        type: t,
        verdict,
        ck: 'C²¹⁰'
      };
      setLogs(l => [line, ...l].slice(0, 50));
    }, 1800);
    return () => clearInterval(id);
  }, [running]);

  return (
    <div>
      <header>
        <div className="logo">
          <div className="logo-icon">Q</div>
          <div>
            <h1>SovereignMesh QPF v300</h1>
            <div className="sub">Operations Console • Nested CK C²¹⁰ • Z3 PROVEN</div>
          </div>
        </div>
        <div style={{display:'flex', gap:8}}>
          <button className="btn btn-run" onClick={() => setRunning(true)}>Run</button>
          <button className="btn btn-pause" onClick={() => setRunning(false)}>Pause</button>
        </div>
      </header>

      <main>
        <div className="control-bar">
          <div className="mode-btns">
            {['NORMAL','STRESS','AIR-GAP'].map(m => (
              <button key={m} className={`mode-btn ${mode===m?'active':''}`} onClick={() => setMode(m)}>{m}</button>
            ))}
          </div>
        </div>

        <div className="grid-4">
          <div className="metric-card"><div className="metric-label">Nested CK</div><div className="metric-value" style={{color:'#22d3ee'}}>{metrics.ck}</div><div className="metric-sub">higher-order C(C²¹⁰(φ))</div></div>
          <div className="metric-card"><div className="metric-label">Z3 Invariants</div><div className="metric-value" style={{color:'#34d399'}}>{metrics.z3}</div><div className="metric-sub">PROVEN</div></div>
          <div className="metric-card"><div className="metric-label">AF_XDP Latency</div><div className="metric-value" style={{color:'#a855f7'}}>{metrics.latency}</div><div className="metric-sub">model</div></div>
          <div className="metric-card"><div className="metric-label">Mesh Nodes</div><div className="metric-value" style={{color:'#fbbf24'}}>{metrics.nodes}</div><div className="metric-sub">entropy {metrics.entropy}</div></div>
        </div>

        <div className="panel">
          <h2>🌐 Mesh Topology</h2>
          <canvas className="mesh-canvas" ref={c => {
            if (!c) return;
            const ctx = c.getContext('2d');
            c.width = c.offsetWidth; c.height = 200;
            ctx.fillStyle = '#020617'; ctx.fillRect(0,0,c.width,c.height);
            const nodes = 8;
            for (let i=0; i<nodes; i++) {
              const x = 40 + i * (c.width-80)/ (nodes-1);
              const y = 100 + Math.sin(i*0.8)*40;
              ctx.beginPath(); ctx.arc(x,y,8,0,Math.PI*2);
              ctx.fillStyle = i%2 ? '#22d3ee' : '#a855f7'; ctx.fill();
              if (i>0) {
                ctx.strokeStyle = 'rgba(34,211,238,0.4)';
                ctx.beginPath(); ctx.moveTo(x- (c.width-80)/(nodes-1), 100 + Math.sin((i-1)*0.8)*40); ctx.lineTo(x,y); ctx.stroke();
              }
            }
          }} />
        </div>

        <div className="panel">
          <h2>📜 Activity Log – Payment Stream</h2>
          <div className="log-box">
            {logs.map((l,i) => (
              <div key={i} className="log-line">
                <span>{l.time} • {l.type} • {l.ck}</span>
                <span className={l.verdict==='ALLOW'?'status-ok':'status-drop'}>{l.verdict}</span>
              </div>
            ))}
            {logs.length===0 && <div className="log-line status-info">Waiting for stream…</div>}
          </div>
        </div>

        <div className="footer">SovereignMesh QPF v300 • Model only • Air-gapped local • Runtime tests PASSED • 2026-11-14</div>
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
