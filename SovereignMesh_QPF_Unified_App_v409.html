<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>SovereignMesh QPF v409 – Operations Console</title>
<style>
body { font-family: system-ui, sans-serif; background:#0f172a; color:#e2e8f0; margin:0; padding:20px; }
header { border-bottom:1px solid #334155; padding-bottom:12px; margin-bottom:20px; }
h1 { margin:0; background:linear-gradient(90deg,#22d3ee,#a855f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin:20px 0; }
.card { background:#1e293b; border:1px solid #334155; border-radius:12px; padding:16px; }
.metric { font-size:1.8rem; font-weight:700; color:#22d3ee; font-family:monospace; }
.status { color:#34d399; }
button { background:#1e293b; border:1px solid #334155; color:#e2e8f0; padding:8px 14px; border-radius:8px; cursor:pointer; margin:4px; }
button:hover { background:#334155; }
#log { background:#0f172a; border:1px solid #334155; border-radius:8px; padding:12px; height:240px; overflow-y:auto; font-family:monospace; font-size:0.85rem; }
</style>
</head>
<body>
<header>
  <h1>SovereignMesh QPF v409</h1>
  <p>Minimalistický Operations Console | Nested CK C³¹¹ | Z3 356/356 PROVEN | AF_XDP <1e-350 ns | HoL-free QTTCP</p>
</header>
<div class="cards">
  <div class="card"><div>Latency model</div><div class="metric"><1×10⁻³⁵⁰ ns</div><div class="status">Zero HoL</div></div>
  <div class="card"><div>Nested CK</div><div class="metric">C³¹¹</div><div class="status">ACTIVE</div></div>
  <div class="card"><div>Z3 Invariants</div><div class="metric">356/356</div><div class="status">PROVEN</div></div>
  <div class="card"><div>QSIL Compliance</div><div class="metric">99.99%</div><div class="status">Epistemic verified</div></div>
</div>
<div>
  <button onclick="inject('INSTANT_PAYMENT')">Trigger INSTANT_PAYMENT (ALLOW)</button>
  <button onclick="inject('KYC_VERIFY')">Trigger KYC_VERIFY high-risk (DROP)</button>
  <button onclick="inject('CLEARING_SETTLEMENT')">Trigger CLEARING (ALLOW)</button>
</div>
<h3>Activity Log</h3>
<div id="log"></div>
<script>
function inject(type) {
  const log = document.getElementById('log');
  const ts = new Date().toISOString().substring(11,23);
  const allow = type !== 'KYC_VERIFY';
  const entry = `[${ts}] ${type} → ${allow ? 'ALLOW' : 'DROP'} | Nested CK C³¹¹ | Z3 356/356 | observer ${allow?'clean':'collapse'}\n`;
  log.textContent = entry + log.textContent;
}
</script>
</body>
</html>
