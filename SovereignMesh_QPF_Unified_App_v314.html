<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SovereignMesh QPF v314 – Operations Console</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
body { margin:0; background:#0f172a; color:#f1f5f9; font-family:system-ui,sans-serif; }
.card { background:#1e293b; border:1px solid #334155; border-radius:12px; padding:16px; }
.metric { font-size:1.8rem; font-weight:700; color:#22d3ee; }
.btn { background:#0e7490; color:white; border:none; padding:8px 14px; border-radius:8px; cursor:pointer; }
.btn:hover { background:#155e75; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function App() {
  const [metrics, setMetrics] = React.useState({
    latency: 1e-255,
    throughput: 1850,
    compliance: 99.99,
    ck: "C²²⁴ ACTIVE",
    z3: "261/261 PROVEN"
  });
  const [running, setRunning] = React.useState(true);
  const [logs, setLogs] = React.useState([]);

  React.useEffect(() => {
    if (!running) return;
    const t = setInterval(() => {
      setMetrics(m => ({
        ...m,
        throughput: 1700 + Math.floor(Math.random()*300)
      }));
      if (Math.random() > 0.6) {
        const types = ["INSTANT_PAYMENT","CLEARING_SETTLEMENT","KYC_VERIFY"];
        const tx = types[Math.floor(Math.random()*types.length)];
        setLogs(l => [{t: new Date().toISOString().slice(11,23), tx, v: tx.includes("KYC")?"DROP":"ALLOW"}, ...l.slice(0,19)]);
      }
    }, 900);
    return () => clearInterval(t);
  }, [running]);

  return (
    <div style={{padding:24, maxWidth:1100, margin:"0 auto"}}>
      <h1 style={{background:"linear-gradient(90deg,#22d3ee,#a855f7)", WebkitBackgroundClip:"text", color:"transparent"}}>
        SovereignMesh QPF v314 – Operations Console
      </h1>
      <p style={{color:"#94a3b8"}}>Nested CK C²²⁴ · Z3 261/261 PROVEN · AF_XDP model &lt;1×10⁻²⁵⁵ ns · 55-fold temporal epistemic nesting · Full Native Pay QTTCP</p>

      <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))", gap:16, marginTop:24}}>
        <div className="card"><div>Latency model</div><div className="metric">&lt;1×10⁻²⁵⁵ ns</div></div>
        <div className="card"><div>Throughput</div><div className="metric">{metrics.throughput} tx/s</div></div>
        <div className="card"><div>QSIL Compliance</div><div className="metric">{metrics.compliance}%</div></div>
        <div className="card"><div>Nested CK</div><div className="metric" style={{fontSize:"1.2rem"}}>{metrics.ck}</div></div>
      </div>

      <div style={{marginTop:24}} className="card">
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
          <strong>Live Telemetry</strong>
          <button className="btn" onClick={()=>setRunning(!running)}>{running?"Pause":"Resume"}</button>
        </div>
        <div style={{marginTop:12, fontFamily:"monospace", fontSize:12, maxHeight:280, overflow:"auto"}}>
          {logs.map((l,i)=>(
            <div key={i} style={{padding:"4px 0", borderBottom:"1px solid #334155"}}>
              [{l.t}] {l.tx} → <span style={{color:l.v==="ALLOW"?"#34d399":"#f87171"}}>{l.v}</span>
            </div>
          ))}
          {logs.length===0 && <div style={{color:"#64748b"}}>Listening…</div>}
        </div>
      </div>

      <div style={{marginTop:16, color:"#64748b", fontSize:12}}>
        Model demonstration only. Public assets sanitized. © 2026 SovereignMesh / QPF
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
