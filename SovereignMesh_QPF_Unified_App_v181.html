<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>SovereignMesh QPF v181 – Operations Console</title>
<style>
body{margin:0;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif}
.header{padding:12px 20px;background:#1e293b;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:18px;background:linear-gradient(90deg,#22d3ee,#a855f7);-webkit-background-clip:text;color:transparent}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;padding:16px}
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:14px}
.card .val{font-size:22px;font-weight:700;font-family:monospace;color:#22d3ee}
.canvas-wrap{margin:0 16px;background:#020617;border-radius:12px;border:1px solid #334155;overflow:hidden}
.log{font-family:monospace;font-size:12px;background:#020617;border-radius:12px;margin:16px;padding:12px;height:200px;overflow:auto;border:1px solid #334155}
.btn{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:6px 12px;border-radius:8px;cursor:pointer}
.btn:hover{background:#334155}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>SovereignMesh QPF v181</h1>
    <div style="font-size:12px;color:#94a3b8">Operations Console · Nested CK Cⁱ · Z3 128/128 PROVEN · &lt;1×10⁻¹²² ns</div>
  </div>
  <button class="btn" id="run">Simulation Active</button>
</div>
<div class="metrics">
  <div class="card"><div>Latency model</div><div class="val" id="lat">1e-122 ns</div></div>
  <div class="card"><div>Z3 Invariants</div><div class="val">128/128</div></div>
  <div class="card"><div>Nested CK</div><div class="val">Cⁱ</div></div>
  <div class="card"><div>Payment Stack</div><div class="val">QTTCP PROTECTED</div></div>
</div>
<div class="canvas-wrap"><canvas id="mesh" style="width:100%;height:180px"></canvas></div>
<div class="log" id="log"></div>
<script>
const canvas = document.getElementById('mesh');
const ctx = canvas.getContext('2d');
const logEl = document.getElementById('log');
let running = true;
document.getElementById('run').onclick = () => { running = !running; document.getElementById('run').textContent = running ? 'Simulation Active' : 'Paused'; };
function resize(){ canvas.width = canvas.clientWidth; canvas.height = 180; }
window.onresize = resize; resize();
const nodes = [{x:0.15,y:0.5,label:'Client'},{x:0.4,y:0.3,label:'Sidecar A'},{x:0.6,y:0.7,label:'Sidecar B'},{x:0.85,y:0.5,label:'Ledger'}];
let packets = [];
function draw(){
  if(!running){ requestAnimationFrame(draw); return; }
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle = 'rgba(168,85,247,0.4)';
  ctx.setLineDash([4,4]);
  [[0,1],[0,2],[1,3],[2,3],[1,2]].forEach(([i,j])=>{
    ctx.beginPath(); ctx.moveTo(nodes[i].x*canvas.width, nodes[i].y*canvas.height);
    ctx.lineTo(nodes[j].x*canvas.width, nodes[j].y*canvas.height); ctx.stroke();
  });
  ctx.setLineDash([]);
  if(Math.random()<0.08) packets.push({route:Math.random()>0.5?[0,1,3]:[0,2,3], step:0, p:0});
  packets = packets.filter(p => {
    p.p += 0.04;
    if(p.p>=1){ p.p=0; p.step++; }
    if(p.step >= p.route.length-1) return false;
    const a = nodes[p.route[p.step]], b = nodes[p.route[p.step+1]];
    const x = (a.x + (b.x-a.x)*p.p)*canvas.width, y = (a.y + (b.y-a.y)*p.p)*canvas.height;
    ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fillStyle='#a855f7'; ctx.fill();
    return true;
  });
  nodes.forEach(n=>{
    const x=n.x*canvas.width, y=n.y*canvas.height;
    ctx.beginPath(); ctx.arc(x,y,14,0,Math.PI*2); ctx.fillStyle='#0f172a'; ctx.strokeStyle='#8b5cf6'; ctx.lineWidth=2; ctx.fill(); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='11px sans-serif'; ctx.textAlign='center'; ctx.fillText(n.label, x, y+28);
  });
  requestAnimationFrame(draw);
}
draw();
function addLog(msg){
  const t = new Date().toISOString().substr(11,12);
  logEl.innerHTML = `<div>[${t}] ${msg}</div>` + logEl.innerHTML;
}
setInterval(()=>{
  if(!running) return;
  const types = ['INSTANT_PAYMENT','KYC_VERIFY','CLEARING'];
  const typ = types[Math.floor(Math.random()*types.length)];
  const lat = (Math.random()*1e-122).toExponential(1);
  addLog(`${typ} · ALLOW · lat model ${lat} ns · Nested CK Cⁱ · Z3 128/128 verified`);
}, 1200);
</script>
</body>
</html>
