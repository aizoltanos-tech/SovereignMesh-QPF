<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>SovereignMesh QPF v282 – Operations Console</title>
<style>
body { margin:0; background:#0f172a; color:#e2e8f0; font-family:system-ui,sans-serif; }
header { padding:16px 24px; background:#1e293b; border-bottom:1px solid #334155; display:flex; align-items:center; gap:12px; }
h1 { margin:0; font-size:1.25rem; background:linear-gradient(90deg,#22d3ee,#a855f7); -webkit-background-clip:text; color:transparent; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; padding:24px; }
.card { background:#1e293b; border:1px solid #334155; border-radius:12px; padding:16px; }
.metric { font-size:1.75rem; font-weight:700; color:#22d3ee; font-family:monospace; }
.status { color:#34d399; font-size:0.75rem; margin-top:4px; }
canvas { width:100%; height:180px; background:#0f172a; border-radius:8px; }
</style>
</head>
<body>
<header>
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
  <div>
    <h1>SovereignMesh QPF v282</h1>
    <div style="font-size:0.75rem;color:#94a3b8">Operations Console • Nested CK C¹⁹² • Z3 229/229 PROVEN</div>
  </div>
</header>
<div class="grid">
  <div class="card"><div>Latency model</div><div class="metric"><1×10⁻²²³ ns</div><div class="status">AF_XDP zero-copy</div></div>
  <div class="card"><div>Nested CK</div><div class="metric">C¹⁹²</div><div class="status">Higher-order ACTIVE</div></div>
  <div class="card"><div>Z3 Invariants</div><div class="metric">229/229</div><div class="status">PROVEN</div></div>
  <div class="card"><div>Horizon</div><div class="metric">111</div><div class="status">Multi-horizon forecast</div></div>
</div>
<div style="padding:0 24px 24px;">
  <div class="card">
    <div style="font-size:0.875rem;margin-bottom:8px;">Mesh Topology (sanitized)</div>
    <canvas id="mesh"></canvas>
  </div>
</div>
<script>
const c = document.getElementById('mesh');
const ctx = c.getContext('2d');
function resize(){ c.width = c.clientWidth; c.height = 180; }
window.addEventListener('resize', resize); resize();
function draw(){
  ctx.clearRect(0,0,c.width,c.height);
  ctx.strokeStyle = 'rgba(168,85,247,0.4)';
  ctx.lineWidth = 1;
  const nodes = [{x:0.15,y:0.5},{x:0.4,y:0.3},{x:0.6,y:0.7},{x:0.85,y:0.5}];
  nodes.forEach((n,i)=>{
    if(i<nodes.length-1){
      ctx.beginPath(); ctx.moveTo(n.x*c.width, n.y*c.height);
      ctx.lineTo(nodes[i+1].x*c.width, nodes[i+1].y*c.height); ctx.stroke();
    }
  });
  nodes.forEach(n=>{
    ctx.beginPath(); ctx.arc(n.x*c.width, n.y*c.height, 8, 0, Math.PI*2);
    ctx.fillStyle='#0f172a'; ctx.fill(); ctx.strokeStyle='#22d3ee'; ctx.stroke();
  });
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
