<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>SovereignMesh QPF v290 – Operations Console</title>
<style>
body { margin:0; background:#0f172a; color:#e2e8f0; font-family:system-ui,sans-serif; }
header { padding:16px 24px; background:#1e293b; border-bottom:1px solid #334155; display:flex; align-items:center; gap:12px; }
h1 { margin:0; font-size:1.25rem; background:linear-gradient(90deg,#22d3ee,#a855f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.badge { background:#065f46; color:#6ee7b7; padding:2px 8px; border-radius:999px; font-size:0.75rem; }
main { padding:24px; max-width:1200px; margin:0 auto; display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); }
.card { background:#1e293b; border:1px solid #334155; border-radius:12px; padding:16px; }
.metric { font-size:1.75rem; font-weight:700; color:#22d3ee; font-family:ui-monospace,monospace; }
.sub { font-size:0.75rem; color:#94a3b8; margin-top:4px; }
canvas { width:100%; height:180px; background:#0f172a; border-radius:8px; }
</style>
</head>
<body>
<header>
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
  <h1>SovereignMesh QPF v290</h1>
  <span class="badge">Nested CK C²⁰⁰ ACTIVE</span>
  <span class="badge">Z3 237/237 PROVEN</span>
  <span class="badge"><1×10⁻²³¹ ns</span>
</header>
<main>
  <div class="card"><div>Latency model</div><div class="metric">1e-231 ns</div><div class="sub">AF_XDP zero-copy path</div></div>
  <div class="card"><div>Throughput</div><div class="metric">1850 tx/s</div><div class="sub">Native Pay QTTCP</div></div>
  <div class="card"><div>QSIL Compliance</div><div class="metric">99.99%</div><div class="sub">Epistemic + Deontic verified</div></div>
  <div class="card"><div>Nested CK</div><div class="metric">C²⁰⁰</div><div class="sub">Horizon 119 predictive</div></div>
  <div class="card" style="grid-column:1/-1;">
    <div>Mesh Topology (sanitized)</div>
    <canvas id="mesh"></canvas>
  </div>
</main>
<script>
const c = document.getElementById('mesh');
const ctx = c.getContext('2d');
function resize(){ c.width = c.clientWidth; c.height = 180; }
window.addEventListener('resize', resize); resize();
function draw(){
  ctx.clearRect(0,0,c.width,c.height);
  ctx.strokeStyle = 'rgba(168,85,247,0.4)';
  ctx.lineWidth = 1;
  const nodes = [{x:0.15,y:0.5},{x:0.4,y:0.3},{x:0.6,y:0.7},{x:0.85,y:0.5}];
  nodes.forEach((n,i)=>{
    nodes.slice(i+1).forEach(m=>{
      ctx.beginPath(); ctx.moveTo(n.x*c.width,n.y*c.height); ctx.lineTo(m.x*c.width,m.y*c.height); ctx.stroke();
    });
  });
  nodes.forEach(n=>{
    ctx.beginPath(); ctx.arc(n.x*c.width,n.y*c.height,10,0,Math.PI*2);
    ctx.fillStyle='#0f172a'; ctx.fill(); ctx.strokeStyle='#22d3ee'; ctx.stroke();
  });
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
