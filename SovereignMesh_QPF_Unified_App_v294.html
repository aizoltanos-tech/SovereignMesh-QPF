<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>SovereignMesh QPF v294 – Operations Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif}
.header{background:#1e293b;padding:16px 24px;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:1.4rem;background:linear-gradient(90deg,#22d3ee,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;padding:24px}
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px}
.metric{font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.good{color:#22c55e} .warn{color:#f59e0b} .bad{color:#ef4444}
.log{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:12px;height:280px;overflow-y:auto;font-family:ui-monospace,monospace;font-size:12px}
button{background:#334155;color:#e2e8f0;border:1px solid #475569;border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{background:#475569}
canvas{width:100%;height:180px;background:#0f172a;border-radius:8px;border:1px solid #334155}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>SovereignMesh QPF v294</h1>
    <div style="font-size:12px;color:#94a3b8">Operations Console · Nested CK C²⁴⁴ · AF_XDP model &lt;1×10⁻²³⁵ ns</div>
  </div>
  <div>
    <button onclick="toggleMode()">Mode: <span id="mode">Normal</span></button>
  </div>
</div>
<div class="grid">
  <div class="card"><div>Latency model</div><div class="metric good" id="lat">1e-235 ns</div></div>
  <div class="card"><div>Z3 Invariants</div><div class="metric good">241/241 PROVEN</div></div>
  <div class="card"><div>Nested CK</div><div class="metric">C²⁴⁴ ACTIVE</div></div>
  <div class="card"><div>Horizon</div><div class="metric">123</div></div>
</div>
<div style="padding:0 24px 24px">
  <div class="card">
    <div style="margin-bottom:8px">Mesh Topology (live simulation)</div>
    <canvas id="mesh"></canvas>
  </div>
  <div class="card" style="margin-top:16px">
    <div style="margin-bottom:8px">Activity Log</div>
    <div class="log" id="log"></div>
    <div style="margin-top:8px">
      <button onclick="inject('INSTANT_PAYMENT')">Trigger Payment</button>
      <button onclick="inject('KYC_VERIFY')">Trigger KYC</button>
      <button onclick="inject('CLEARING_SETTLEMENT')">Trigger Settlement</button>
    </div>
  </div>
</div>
<script>
let mode = 'Normal';
function toggleMode(){ mode = mode==='Normal'?'Stress':mode==='Stress'?'Air-Gap':'Normal'; document.getElementById('mode').textContent=mode; }
function log(msg){ const el=document.getElementById('log'); el.innerHTML = `<div>[${new Date().toISOString().substr(11,12)}] ${msg}</div>` + el.innerHTML; }
function inject(type){ const allow = !type.includes('KYC') && Math.random()>0.2; log(`${type} → ${allow?'ALLOW':'DROP'} · C²⁴⁴ · Z3 241/241`); }
const c = document.getElementById('mesh'); const ctx = c.getContext('2d');
function draw(){
  c.width=c.clientWidth; c.height=180;
  ctx.clearRect(0,0,c.width,c.height);
  ctx.strokeStyle='#a855f7'; ctx.lineWidth=1;
  const nodes=[{x:0.15,y:0.5},{x:0.4,y:0.3},{x:0.6,y:0.7},{x:0.85,y:0.5}];
  nodes.forEach((n,i)=>{
    ctx.beginPath(); ctx.arc(n.x*c.width,n.y*c.height,10,0,Math.PI*2);
    ctx.fillStyle='#0f172a'; ctx.fill(); ctx.stroke();
    if(i<3){ ctx.beginPath(); ctx.moveTo(n.x*c.width,n.y*c.height); ctx.lineTo(nodes[i+1].x*c.width,nodes[i+1].y*c.height); ctx.stroke(); }
  });
  requestAnimationFrame(draw);
}
draw();
log('QPF v294 initialized · Nested CK C²⁴⁴ · Z3 241/241 PROVEN · AF_XDP <1e-235 ns');
setInterval(()=>log('Beacon sync · entropy stable · multi-horizon 123'), 4000);
</script>
</body>
</html>
