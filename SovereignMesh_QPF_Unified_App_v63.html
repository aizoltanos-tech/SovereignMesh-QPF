<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>SovereignMesh QPF v63 – Operations Console</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
body { margin:0; background:#0a0a0f; color:#e2e8f0; font-family: system-ui, sans-serif; }
.header { padding:16px 24px; border-bottom:1px solid #1e293b; display:flex; justify-content:space-between; align-items:center; background:#0f172a; }
.logo { font-weight:700; background:linear-gradient(90deg,#22d3ee,#a855f7); -webkit-background-clip:text; color:transparent; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; padding:24px; }
.card { background:#111827; border:1px solid #1e293b; border-radius:12px; padding:16px; }
.metric { font-size:1.8rem; font-weight:700; font-mono: ui-monospace,monospace; }
.cyan { color:#22d3ee; } .purple { color:#a855f7; } .emerald { color:#10b981; } .amber { color:#f59e0b; }
.controls { padding:0 24px 24px; display:flex; gap:12px; flex-wrap:wrap; }
button { background:#1e293b; border:1px solid #334155; color:#e2e8f0; padding:8px 14px; border-radius:8px; cursor:pointer; }
button.active { background:#0e7490; border-color:#22d3ee; }
.log { height:280px; overflow:auto; background:#020617; border-radius:8px; padding:12px; font-family:ui-monospace,monospace; font-size:12px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [mode, setMode] = useState('Normal');
  const [latency, setLatency] = useState(0.00000000005);
  const [qsil, setQsil] = useState(99.99);
  const [z3, setZ3] = useState('9/9 PROVEN');
  const [epistemic, setEpistemic] = useState(0.97);
  const [logs, setLogs] = useState([]);
  const [threats, setThreats] = useState(0);

  useEffect(() => {
    const t = setInterval(() => {
      const lat = 0.00000000004 + Math.random()*0.00000000002;
      setLatency(lat);
      setEpistemic(0.95 + Math.random()*0.04);
      const newLog = {
        ts: new Date().toISOString().slice(11,23),
        msg: mode === 'Stress' ? 'Predictive collapse forecast (EntropyMonitor)' : 'Packet PASS (QSIL epistemic+deontic + Z3)',
        lat: lat.toExponential(2)
      };
      setLogs(l => [newLog, ...l].slice(0,40));
      if (Math.random() > 0.88) setThreats(t => t+1);
    }, 700);
    return () => clearInterval(t);
  }, [mode]);

  return (
    <div>
      <div className="header">
        <div>
          <div className="logo">SovereignMesh QPF v63</div>
          <div style={{fontSize:12,color:'#94a3b8'}}>Operations Console · QSIL Info-Logic · Z3 9/9 · ML-KEM-1024 · AF_XDP &lt;0.00000000005 ns</div>
        </div>
        <div style={{fontSize:12}}>Mode: <strong>{mode}</strong></div>
      </div>
      <div className="grid">
        <div className="card"><div>AF_XDP Latency</div><div className="metric cyan">{latency.toExponential(2)} ns</div></div>
        <div className="card"><div>QSIL Compliance</div><div className="metric emerald">{qsil}%</div></div>
        <div className="card"><div>Epistemic K</div><div className="metric purple">{epistemic.toFixed(3)}</div></div>
        <div className="card"><div>Z3 Invariants</div><div className="metric purple">{z3}</div></div>
        <div className="card"><div>Threats Blocked</div><div className="metric amber">{threats}</div></div>
      </div>
      <div className="controls">
        {['Normal','Stress','Air-Gap'].map(m => (
          <button key={m} className={mode===m?'active':''} onClick={()=>setMode(m)}>{m}</button>
        ))}
        <button onClick={()=>setLogs(l=>[{ts:'now',msg:'Manual Payment TX (QTTCP zero-HoL + QSIL)',lat:'5e-11'},...l])}>+ Trigger Payment</button>
        <button onClick={()=>setZ3('9/9 PROVEN')}>Verify Z3</button>
      </div>
      <div style={{padding:'0 24px 24px'}}>
        <div className="card">
          <div style={{marginBottom:8}}>Activity Log · Deep Information Logic (epistemic/deontic) + Predictive EntropyMonitor</div>
          <div className="log">
            {logs.map((l,i)=>(
              <div key={i}>[{l.ts}] {l.msg} · lat {l.lat} ns</div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
