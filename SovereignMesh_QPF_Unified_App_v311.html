<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>SovereignMesh QPF v311 – Operations Console</title>
<style>
body { margin:0; background:#0a0e17; color:#e2e8f0; font-family: system-ui, sans-serif; }
header { padding:16px 24px; background:#111827; border-bottom:1px solid #1e2937; display:flex; justify-content:space-between; align-items:center; }
h1 { margin:0; font-size:1.25rem; background:linear-gradient(90deg,#22d3ee,#a855f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.badge { background:#064e3b; color:#6ee7b7; padding:4px 12px; border-radius:999px; font-size:0.75rem; }
main { padding:24px; max-width:1200px; margin:0 auto; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-bottom:24px; }
.card { background:#111827; border:1px solid #1e2937; border-radius:12px; padding:16px; }
.card h3 { margin:0 0 8px; font-size:0.75rem; color:#94a3b8; text-transform:uppercase; letter-spacing:0.05em; }
.card .value { font-size:1.75rem; font-weight:700; color:#22d3ee; font-family:monospace; }
.card .sub { font-size:0.7rem; color:#64748b; margin-top:4px; }
canvas { width:100%; height:180px; background:#0f172a; border-radius:8px; border:1px solid #1e2937; }
.controls { display:flex; gap:12px; margin-top:16px; }
button { background:#1e2937; color:#e2e8f0; border:1px solid #334155; padding:8px 16px; border-radius:8px; cursor:pointer; font-size:0.8rem; }
button:hover { background:#334155; }
</style>
</head>
<body>
<header>
  <div>
    <h1>SovereignMesh QPF v311</h1>
    <div style="font-size:0.75rem;color:#94a3b8;margin-top:2px;">Minimalist Operations Console • Nested CK C²²¹ • &lt;1×10⁻²⁵² ns</div>
  </div>
  <div class="badge">RUNTIME PASSED • Z3 258/258</div>
</header>
<main>
  <div class="grid">
    <div class="card">
      <h3>Latency Model</h3>
      <div class="value">&lt;1e-252</div>
      <div class="sub">ns • AF_XDP zero-copy</div>
    </div>
    <div class="card">
      <h3>Nested CK</h3>
      <div class="value">C²²¹</div>
      <div class="sub">ACTIVE • higher-order</div>
    </div>
    <div class="card">
      <h3>Z3 Verification</h3>
      <div class="value">258/258</div>
      <div class="sub">PROVEN</div>
    </div>
    <div class="card">
      <h3>Horizon</h3>
      <div class="value">140</div>
      <div class="sub">multi-horizon predictive</div>
    </div>
  </div>
  <div class="card">
    <h3>Mesh Topology (live model)</h3>
    <canvas id="mesh"></canvas>
    <div class="controls">
      <button onclick="inject('INSTANT_PAYMENT')">Trigger Instant Payment</button>
      <button onclick="inject('CLEARING')">Trigger Clearing</button>
      <button onclick="inject('KYC')">Trigger KYC (DROP)</button>
    </div>
    <div id="log" style="margin-top:12px;font-family:monospace;font-size:0.75rem;color:#94a3b8;max-height:120px;overflow:auto;"></div>
  </div>
</main>
<script>
const canvas = document.getElementById('mesh');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = canvas.offsetWidth; canvas.height = 180; }
window.addEventListener('resize', resize); resize();
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle = 'rgba(168,85,247,0.4)';
  ctx.lineWidth = 1;
  const nodes = [{x:0.15,y:0.5},{x:0.4,y:0.35},{x:0.6,y:0.65},{x:0.85,y:0.5}];
  nodes.forEach((n,i) => {
    if (i < nodes.length-1) {
      ctx.beginPath();
      ctx.moveTo(n.x*canvas.width, n.y*canvas.height);
      ctx.lineTo(nodes[i+1].x*canvas.width, nodes[i+1].y*canvas.height);
      ctx.stroke();
    }
  });
  nodes.forEach(n => {
    ctx.beginPath();
    ctx.arc(n.x*canvas.width, n.y*canvas.height, 8, 0, Math.PI*2);
    ctx.fillStyle = '#0f172a';
    ctx.strokeStyle = '#22d3ee';
    ctx.lineWidth = 2;
    ctx.fill(); ctx.stroke();
  });
  requestAnimationFrame(draw);
}
draw();
function inject(type) {
  const log = document.getElementById('log');
  const verdict = (type === 'KYC') ? 'DROP' : 'ALLOW';
  const entry = document.createElement('div');
  entry.textContent = `[${new Date().toISOString().substr(11,8)}] ${type} → ${verdict} | CK C²²¹ | Z3 258/258`;
  log.prepend(entry);
  if (log.children.length > 8) log.removeChild(log.lastChild);
}
</script>
</body>
</html>
