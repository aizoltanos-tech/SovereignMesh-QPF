<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>SovereignMesh QPF v480 – Operations Console</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
.header { text-align: center; margin-bottom: 30px; }
.header h1 { background: linear-gradient(90deg, #06b6d4, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.card { background: #1e293b; border-radius: 12px; padding: 20px; margin: 10px; display: inline-block; min-width: 200px; }
.metric { font-size: 1.8em; font-weight: bold; color: #22d3ee; }
.status { color: #34d399; }
.drop { color: #f87171; }
.btn { background: #0ea5e9; color: #0f172a; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; margin: 6px; font-weight: 600; }
.btn:hover { background: #38bdf8; }
.log { background: #020617; border: 1px solid #334155; border-radius: 8px; padding: 12px; max-height: 280px; overflow-y: auto; font-family: ui-monospace, monospace; font-size: 12px; text-align: left; margin-top: 20px; }
</style>
</head>
<body>
<div class="header">
  <h1>SovereignMesh QPF v480</h1>
  <p>Minimalistický operations console · Nested CK C³⁹⁰ · Z3 427/427 PROVEN · AF_XDP model &lt;1×10⁻⁴²¹ ns</p>
</div>

<div style="text-align:center;">
  <div class="card">
    <div>Latency model</div>
    <div class="metric">&lt;1×10⁻⁴²¹ ns</div>
  </div>
  <div class="card">
    <div>Z3 formal verification</div>
    <div class="metric">427/427 PROVEN</div>
  </div>
  <div class="card">
    <div>Horizon</div>
    <div class="metric">309</div>
  </div>
  <div class="card">
    <div>Temporal nesting</div>
    <div class="metric">221×</div>
  </div>
  <div class="card">
    <div>Status</div>
    <div class="metric status">OPERATIONAL</div>
  </div>
</div>

<div style="text-align:center; margin-top: 24px;">
  <button class="btn" onclick="sim('INSTANT_PAYMENT')">Trigger Instant Payment</button>
  <button class="btn" onclick="sim('KYC_VERIFY')">Trigger e-KYC</button>
  <button class="btn" onclick="sim('CLEARING_SETTLEMENT')">Trigger Clearing</button>
  <button class="btn" style="background:#f43f5e;color:#fff" onclick="sim('IOC_FRAUD')">Inject IOC / Fraud</button>
</div>

<div class="log" id="log">Listening for QSIL-enriched streams…</div>

<script>
const logEl = document.getElementById('log');
function addLog(msg, isDrop) {
  const line = document.createElement('div');
  line.style.color = isDrop ? '#f87171' : '#34d399';
  line.textContent = '[' + new Date().toISOString().substr(11,12) + '] ' + msg;
  logEl.insertBefore(line, logEl.firstChild);
}
function sim(tx) {
  const drop = tx.includes('IOC') || tx.includes('FRAUD');
  const verdict = drop ? 'DROP (observer_collapse / QSIL_policy)' : 'ALLOW (QSIL_permitted, C390, HoL-free)';
  addLog(tx + ' → ' + verdict + ' | nested CK C³⁹⁰ | Z3 427/427 | latency model <1e-421 ns', drop);
}
setInterval(() => {
  if (Math.random() > 0.7) {
    const txs = ['INSTANT_PAYMENT','CLEARING_SETTLEMENT','KYC_VERIFY'];
    sim(txs[Math.floor(Math.random()*txs.length)]);
  }
}, 2800);
</script>
</body>
</html>
