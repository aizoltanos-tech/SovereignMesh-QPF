<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SovereignMesh QPF v112 Operations Console</title>
<style>
body { background:#0f172a; color:#e2e8f0; font-family:system-ui; margin:0; padding:20px; }
header { border-bottom:1px solid #334155; padding-bottom:12px; margin-bottom:20px; }
h1 { margin:0; background:linear-gradient(to right,#22d3ee,#a855f7); -webkit-background-clip:text; color:transparent; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin:20px 0; }
.card { background:#1e293b; border:1px solid #334155; border-radius:12px; padding:16px; }
.metric { font-size:1.8rem; font-weight:bold; color:#22d3ee; }
.btn { background:#0ea5e9; color:white; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; margin:4px; }
canvas { width:100%; height:200px; background:#020617; border-radius:8px; }
</style>
</head>
<body>
<header>
  <h1>SovereignMesh-Pay / QPF v112</h1>
  <p>Operations Console – Nested C(C(C(φ))) | AF_XDP <1e-54 ns | Z3 60/60 PROVEN</p>
</header>
<div class="cards">
  <div class="card"><div>Latency model</div><div class="metric"><1e-54 ns</div></div>
  <div class="card"><div>Z3 Invariants</div><div class="metric">60/60 PROVEN</div></div>
  <div class="card"><div>QSIL Nested CK</div><div class="metric">C(C(C(φ)))</div></div>
  <div class="card"><div>Payment Stack</div><div class="metric">QTTCP PROTECTED</div></div>
</div>
<button class="btn" onclick="alert('Simulation mode: Normal')">Normal</button>
<button class="btn" onclick="alert('Simulation mode: Stress')">Stress</button>
<button class="btn" onclick="alert('Simulation mode: Air-Gap')">Air-Gap</button>
<canvas id="mesh"></canvas>
<script>
const c = document.getElementById('mesh');
const ctx = c.getContext('2d');
c.width = c.offsetWidth; c.height = 200;
function draw() {
  ctx.clearRect(0,0,c.width,c.height);
  ctx.strokeStyle = 'rgba(168,85,247,0.4)';
  ctx.beginPath(); ctx.moveTo(50,100); ctx.lineTo(200,60); ctx.lineTo(350,100); ctx.lineTo(500,140); ctx.stroke();
  ctx.fillStyle = '#a855f7'; ctx.beginPath(); ctx.arc(200,60,6,0,Math.PI*2); ctx.fill();
  requestAnimationFrame(draw);
}
draw();
</script>
<p style="font-size:0.8rem;color:#94a3b8">Sanitized operations console. No internal mechanisms exposed.</p>
</body>
</html>
