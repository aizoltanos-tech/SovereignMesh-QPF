<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>SovereignMesh QPF v402 – Operations Console</title>
<style>
body { margin:0; background:#0f172a; color:#e2e8f0; font-family:system-ui,sans-serif; }
header { padding:16px 24px; background:#1e293b; border-bottom:1px solid #334155; display:flex; align-items:center; gap:12px; }
h1 { margin:0; font-size:1.25rem; background:linear-gradient(90deg,#22d3ee,#a855f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.badge { background:#065f46; color:#6ee7b7; padding:2px 8px; border-radius:999px; font-size:0.75rem; }
main { padding:24px; max-width:1200px; margin:0 auto; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-bottom:24px; }
.card { background:#1e293b; border:1px solid #334155; border-radius:12px; padding:16px; }
.card h3 { margin:0 0 8px; font-size:0.85rem; color:#94a3b8; }
.metric { font-size:1.5rem; font-weight:700; color:#22d3ee; font-family:ui-monospace,monospace; }
.controls { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:24px; }
button { background:#334155; color:#e2e8f0; border:1px solid #475569; padding:8px 16px; border-radius:8px; cursor:pointer; }
button.active { background:#0e7490; border-color:#22d3ee; }
.log { background:#020617; border:1px solid #334155; border-radius:12px; padding:16px; height:280px; overflow:auto; font-family:ui-monospace,monospace; font-size:0.8rem; }
.log div { margin-bottom:6px; border-bottom:1px solid #1e293b; padding-bottom:4px; }
.allow { color:#6ee7b7; } .drop { color:#f87171; }
</style>
</head>
<body>
<header>
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
  <h1>SovereignMesh QPF v402</h1>
  <span class="badge">Operations Console</span>
</header>
<main>
  <div class="grid">
    <div class="card"><h3>Nested CK</h3><div class="metric">C³¹² ACTIVE</div></div>
    <div class="card"><h3>Latency model</h3><div class="metric">&lt;1×10⁻³⁴³ ns</div></div>
    <div class="card"><h3>Z3 verification</h3><div class="metric">349/349 PROVEN</div></div>
    <div class="card"><h3>Horizon</h3><div class="metric">231</div></div>
  </div>
  <div class="controls">
    <button class="active" onclick="setMode('NORMAL')">Normal</button>
    <button onclick="setMode('STRESS')">Stress</button>
    <button onclick="setMode('AIRGAP')">Air-Gap</button>
    <button onclick="inject('INSTANT_PAYMENT')">Trigger Payment</button>
    <button onclick="inject('KYC_VERIFY')">Trigger KYC</button>
  </div>
  <div class="log" id="log">
    <div>SovereignMesh QPF v402 operations console ready.</div>
    <div>Nested CK C³¹² · Full Native Pay QTTCP · HoL-free</div>
    <div>Runtime tests: PASSED (ALLOW payment / DROP high-risk)</div>
  </div>
</main>
<script>
function setMode(m){ document.querySelectorAll('button').forEach(b=>b.classList.remove('active')); event.target.classList.add('active'); log(`Mode → ${m}`); }
function inject(t){ const allow = !t.includes('KYC') && !t.includes('RISK'); log(`${t} → <span class="${allow?'allow':'drop'}">${allow?'ALLOW':'DROP'}</span>`); }
function log(msg){ const el=document.getElementById('log'); el.innerHTML = `<div>[${new Date().toISOString().slice(11,23)}] ${msg}</div>` + el.innerHTML; }
</script>
</body>
</html>
