<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>SovereignMesh QPF v65 – Operations Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root { --bg:#0a0e17; --card:#111827; --border:#1f2937; --cyan:#22d3ee; --purple:#a78bfa; --emerald:#34d399; --amber:#fbbf24; --rose:#fb7185; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:#e5e7eb;min-height:100vh}
header{border-bottom:1px solid var(--border);background:#0f172a;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:10}
h1{font-size:18px;background:linear-gradient(90deg,#22d3ee,#a78bfa,#34d399);-webkit-background-clip:text;color:transparent;font-weight:700}
.sub{font-size:12px;color:#9ca3af}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#1f2937;color:#e5e7eb}
.btn.emerald{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.4);color:var(--emerald)}
.btn.amber{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.4);color:var(--amber)}
.btn.rose{background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.4);color:var(--rose)}
main{max-width:1280px;margin:0 auto;padding:20px;display:grid;gap:16px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
.metric{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.metric.cyan{color:var(--cyan)} .metric.purple{color:var(--purple)} .metric.emerald{color:var(--emerald)} .metric.amber{color:var(--amber)}
.label{font-size:11px;color:#9ca3af;margin-bottom:4px}
.canvas-wrap{background:#020617;border-radius:12px;border:1px solid var(--border);height:220px;position:relative;overflow:hidden}
canvas{width:100%;height:100%}
.log{font-family:ui-monospace,monospace;font-size:11px;background:#020617;border-radius:10px;padding:12px;height:200px;overflow-y:auto;border:1px solid var(--border)}
.mode-bar{display:flex;gap:8px}
.mode{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#1f2937}
.mode.active{background:rgba(34,211,238,.15);border-color:var(--cyan);color:var(--cyan)}
.pipeline{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0;font-size:11px}
.pipe{padding:4px 8px;border-radius:6px;background:#1f2937;border:1px solid var(--border)}
.pipe.ok{border-color:rgba(52,211,153,.4);color:var(--emerald)}
.injectors{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function App() {
  const [latency, setLatency] = React.useState(0.00000000001);
  const [threats, setThreats] = React.useState(0);
  const [mode, setMode] = React.useState('NORMAL');
  const [beacon, setBeacon] = React.useState('ENTANGLED');
  const [entropy, setEntropy] = React.useState(0.14);
  const [qsilEpistemic, setQsilEpistemic] = React.useState('K_i DYNAMIC');
  const [qsilDeontic, setQsilDeontic] = React.useState('99.99%');
  const [payment, setPayment] = React.useState('PROTECTED');
  const [z3, setZ3] = React.useState('11/11 PROVEN');
  const [mlkem, setMlkem] = React.useState('ML-KEM-1024');
  const [forecast, setForecast] = React.useState('STABLE');
  const [qtp, setQtp] = React.useState('ACTIVE');
  const [logs, setLogs] = React.useState([
    '[INIT] SovereignMesh QPF v65 online · QTP-native Quantum Telemetry · QSIL-enriched Bell-state · Dynamické K_i(φ|obs) · Deontický engine · Z3 11/11 PROVEN · ML-KEM-1024 · AF_XDP <0.00000000001 ns',
    '[QTP] Bell-state |Φ+⟩ stabilizován · EntropyMonitor predictive collapse · Shannon/Rényi/Tsallis · Observer effect ready',
    '[QSIL] Dynamické epistemické update operátory na multi-node entanglement · Deontická obligační engine',
    '[BEACON] QSIL-enriched quantum entanglement · ENTANGLED · TPM sealed',
    '[PAY] Full SovereignMesh-Pay · QTTCP zero-HoL + QSIL epistemic/deontic',
    '[Z3] Runtime multi-node gossip · 11/11 PROVEN (No-Cloning + epistemic + QTP consistency)'
  ]);
  const [running, setRunning] = React.useState(true);

  React.useEffect(() => {
    if (!running) return;
    const t = setInterval(() => {
      const base = mode === 'STRESS' ? 0.00000000004 : mode === 'AIRGAP' ? 0.00000000001 : 0.00000000001;
      setLatency(base + Math.random() * 0.000000000005);
      setEntropy(0.08 + Math.random() * 0.08);
      if (Math.random() > 0.93) {
        setThreats(x => x + 1);
        setBeacon('COLLAPSE');
        setForecast('COLLAPSE_IMMINENT');
        setTimeout(() => { setBeacon('ENTANGLED'); setForecast('STABLE'); }, 1200);
      }
      if (Math.random() > 0.85) {
        const msgs = [
          '[QTP] Telemetry transmitted · Bell consistency OK',
          '[QSIL] Epistemic K_i updated · Deontic ALLOW',
          '[ENTROPY] Multi-dim stable · forecast ' + (0.1 + Math.random()*0.2).toFixed(2),
          '[PAY] QTTCP stream isolated · zero HoL',
          '[TI] Signed IOC map clean'
        ];
        setLogs(l => [msgs[Math.floor(Math.random()*msgs.length)], ...l].slice(0, 12));
      }
    }, 900);
    return () => clearInterval(t);
  }, [running, mode]);

  return (
    <div>
      <header>
        <div>
          <h1>SovereignMesh QPF v65</h1>
          <div className="sub">QTP-Native Operations Console · QSIL-Enriched Entanglement · Zero-Trust Banking Firewall</div>
        </div>
        <div className="controls">
          <div className="mode-bar">
            {['NORMAL','STRESS','AIRGAP'].map(m => (
              <div key={m} className={`mode ${mode===m?'active':''}`} onClick={()=>setMode(m)}>{m}</div>
            ))}
          </div>
          <button className="btn emerald" onClick={()=>setRunning(!running)}>{running?'Pause':'Resume'}</button>
        </div>
      </header>
      <main>
        <div className="grid4">
          <div className="card"><div className="label">AF_XDP Path Latency</div><div className="metric cyan">{latency.toExponential(2)} ns</div><div className="sub">Zero-copy model · SmartNIC target</div></div>
          <div className="card"><div className="label">QSIL Beacon</div><div className="metric purple">{beacon}</div><div className="sub">Bell-state |Φ+⟩ · QTP core</div></div>
          <div className="card"><div className="label">Entropy Forecast</div><div className="metric emerald">{entropy.toFixed(3)}</div><div className="sub">{forecast} · Shannon/Rényi/Tsallis</div></div>
          <div className="card"><div className="label">Threats Dropped</div><div className="metric amber">{threats}</div><div className="sub">Predictive detection</div></div>
        </div>

        <div className="card">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <div><b>Pipeline</b> · Ingress → XDP → TI → Entropy → QTP/QSIL → Verdict</div>
            <div className="sub">Z3 {z3} · {mlkem} · Pay {payment} · QTP {qtp}</div>
          </div>
          <div className="pipeline">
            <div className="pipe ok">Ingress</div>
            <div className="pipe ok">XDP/AF_XDP</div>
            <div className="pipe ok">Signed TI</div>
            <div className="pipe ok">EntropyMonitor</div>
            <div className="pipe ok">QTP Bell</div>
            <div className="pipe ok">QSIL Epistemic/Deontic</div>
            <div className="pipe ok">ALLOW / DROP</div>
          </div>
          <div className="injectors">
            <button className="btn" onClick={()=>setLogs(l=>['[INJECT] Clean payment packet · ALLOW', ...l].slice(0,12))}>Inject Clean</button>
            <button className="btn amber" onClick={()=>{setThreats(t=>t+1); setLogs(l=>['[INJECT] IOC match · DROP', ...l].slice(0,12));}}>Inject IOC</button>
            <button className="btn rose" onClick={()=>{setBeacon('COLLAPSE'); setLogs(l=>['[INJECT] Observer effect · COLLAPSE', ...l].slice(0,12)); setTimeout(()=>setBeacon('ENTANGLED'),1000);}}>Inject Entropy</button>
            <button className="btn" onClick={()=>setLogs(l=>['[INJECT] Payment stream · QTTCP zero-HoL', ...l].slice(0,12))}>Inject Payment</button>
          </div>
        </div>

        <div className="card">
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
            <b>Mesh Topology · QTP Entanglement Pulses</b>
            <div className="sub">Epistemic: {qsilEpistemic} · Deontic: {qsilDeontic}</div>
          </div>
          <div className="canvas-wrap">
            <canvas id="mesh" />
          </div>
        </div>

        <div className="card">
          <b>Activity Log</b>
          <div className="log">{logs.map((l,i)=><div key={i}>{l}</div>)}</div>
        </div>
      </main>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

// Simple mesh canvas
const c = document.getElementById('mesh');
const ctx = c.getContext('2d');
function draw() {
  c.width = c.clientWidth; c.height = c.clientHeight;
  ctx.clearRect(0,0,c.width,c.height);
  const nodes = [
    {x:0.15,y:0.5,l:'Client'}, {x:0.4,y:0.3,l:'Sidecar A'}, {x:0.6,y:0.7,l:'Sidecar B'}, {x:0.85,y:0.5,l:'Ledger'}
  ];
  ctx.strokeStyle = 'rgba(167,139,250,0.4)';
  ctx.setLineDash([4,4]);
  nodes.forEach((n,i)=>nodes.slice(i+1).forEach(m=>{
    ctx.beginPath(); ctx.moveTo(n.x*c.width,n.y*c.height); ctx.lineTo(m.x*c.width,m.y*c.height); ctx.stroke();
  }));
  ctx.setLineDash([]);
  nodes.forEach(n=>{
    ctx.beginPath(); ctx.arc(n.x*c.width,n.y*c.height,14,0,Math.PI*2);
    ctx.fillStyle='#0f172a'; ctx.fill(); ctx.strokeStyle='#a78bfa'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#e5e7eb'; ctx.font='11px sans-serif'; ctx.textAlign='center';
    ctx.fillText(n.l, n.x*c.width, n.y*c.height+28);
  });
  // pulses
  if (Math.random()>0.7) {
    ctx.fillStyle='#22d3ee';
    ctx.beginPath(); ctx.arc(Math.random()*c.width, Math.random()*c.height, 4, 0, Math.PI*2); ctx.fill();
  }
  requestAnimationFrame(draw);
}
setTimeout(draw, 200);
</script>
</body>
</html>
