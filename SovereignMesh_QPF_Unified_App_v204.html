<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>SovereignMesh QPF v204 – Operations Console</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
body { margin:0; background:#0f172a; color:#f1f5f9; font-family:system-ui,sans-serif; }
.card { background:#1e293b; border:1px solid #334155; border-radius:12px; padding:16px; margin:8px; }
.metric { font-size:1.8rem; font-weight:700; color:#22d3ee; }
.btn { background:#0ea5e9; color:white; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; margin:4px; }
.btn:hover { background:#0284c7; }
.allow { color:#10b981; } .drop { color:#f43f5e; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [metrics, setMetrics] = useState({
    latency: 1e-144,
    throughput: 1850,
    entropy: 0.37,
    compliance: 99.99,
    nestedCK: "C¹¹⁴",
    z3: "151/151 PROVEN",
    mode: "NORMAL"
  });
  const [logs, setLogs] = useState([]);
  const [running, setRunning] = useState(true);

  useEffect(() => {
    if (!running) return;
    const iv = setInterval(() => {
      const types = ["INSTANT_PAYMENT", "CLEARING_SETTLEMENT", "KYC_VERIFY"];
      const tx = types[Math.floor(Math.random()*types.length)];
      const verdict = (tx === "KYC_VERIFY") ? "DROP" : "ALLOW";
      const log = { t: new Date().toISOString().substr(11,12), tx, verdict, lat: metrics.latency };
      setLogs(l => [log, ...l].slice(0,15));
      setMetrics(m => ({...m, throughput: 1700 + Math.floor(Math.random()*300)}));
    }, 900);
    return () => clearInterval(iv);
  }, [running]);

  return (
    <div style={{padding:20, maxWidth:1200, margin:"0 auto"}}>
      <h1 style={{background:"linear-gradient(90deg,#22d3ee,#a855f7)", WebkitBackgroundClip:"text", color:"transparent"}}>
        SovereignMesh QPF v204 – Operations Console
      </h1>
      <p>Nested CK C¹¹⁴ • AF_XDP <1×10⁻¹⁴⁵ ns • Z3 151/151 PROVEN • Full Native Pay QTTCP • Dynamic Belief Revision + Refined Temporal Epistemic</p>

      <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))", gap:12}}>
        <div className="card"><div>Latency model</div><div className="metric"><1e-144 ns</div></div>
        <div className="card"><div>Throughput</div><div className="metric">{metrics.throughput} tx/s</div></div>
        <div className="card"><div>Nested CK</div><div className="metric">{metrics.nestedCK}</div></div>
        <div className="card"><div>Z3</div><div className="metric">{metrics.z3}</div></div>
        <div className="card"><div>QSIL Compliance</div><div className="metric">{metrics.compliance}%</div></div>
        <div className="card"><div>Mode</div><div className="metric">{metrics.mode}</div></div>
      </div>

      <div style={{marginTop:20}}>
        <button className="btn" onClick={()=>setRunning(!running)}>{running?"Pause":"Resume"}</button>
        <button className="btn" onClick={()=>setMetrics(m=>({...m,mode:m.mode==="NORMAL"?"STRESS":"NORMAL"}))}>Toggle Stress</button>
        <button className="btn" onClick={()=>setMetrics(m=>({...m,mode:"AIR-GAP"}))}>Air-Gap</button>
      </div>

      <div className="card" style={{marginTop:20}}>
        <h3>Live Activity Log (sanitized)</h3>
        {logs.map((l,i)=>(
          <div key={i} style={{fontFamily:"monospace", fontSize:12, padding:4, borderBottom:"1px solid #334155"}}>
            [{l.t}] {l.tx} → <span className={l.verdict==="ALLOW"?"allow":"drop"}>{l.verdict}</span>
          </div>
        ))}
        {logs.length===0 && <div>Waiting for packets...</div>}
      </div>

      <div className="card" style={{marginTop:12, fontSize:12, color:"#94a3b8"}}>
        Minimalistický operations console. Žádné interní mechanismy. Pouze veřejné metriky a stav.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
